<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analisis Penggunaan Tanah</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.theme ||
          (matchMedia("(prefers-color-scheme:dark)").matches
            ? "dark"
            : "light");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
    <script>
      document.documentElement.classList.add("guard");
    </script>
  </head>
  <body>
    <header>
      <h1>
        <span class="logo"
          ><svg class="i" viewBox="0 0 24 24">
            <path
              d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
            /></svg></span
        >Analisis Penggunaan Tanah
      </h1>
      <select id="bm" title="Basemap tahun" disabled>
        <option value="">Citra terbaru</option>
      </select>
      <button
        class="icon-btn"
        id="theme"
        title="Ganti tema"
        aria-label="Ganti tema"
      >
        <svg class="i moon" viewBox="0 0 24 24">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="i sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>
      <select id="kab" title="Filter kabupaten/kota" disabled>
        <option value="">Semua kabupaten</option>
      </select>
      <select id="kec" title="Filter kecamatan" disabled>
        <option value="">Semua kecamatan</option>
      </select>
      <button class="btn" id="pick">
        <svg class="i" viewBox="0 0 24 24">
          <path
            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"
          /></svg
        >Unggah ZIP Shapefile
      </button>
      <input type="file" id="file" accept=".zip" hidden />
    </header>
    <main>
      <div id="mapwrap">
        <div id="map"></div>
        <div id="empty">
          <svg class="i" style="width: 44px; height: 44px" viewBox="0 0 24 24">
            <path
              d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"
            />
          </svg>
          <div>
            <b>Tarik dan lepas file .zip shapefile di sini</b><br /><span
              style="opacity: 0.8"
              >atau klik tombol Unggah. ZIP harus berisi .shp, .dbf, dan
              sebaiknya .prj</span
            >
          </div>
        </div>
        <div id="sym">
          <div class="sh" id="sht">
            <svg class="i" viewBox="0 0 24 24">
              <path
                d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              /></svg
            >Simbologi dan Legenda<span style="flex: 1"></span>
            <svg class="i chev" viewBox="0 0 24 24">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </div>
          <div id="sb">
            <div class="sr">
              <span>Opasitas</span
              ><input type="range" id="op" min="0" max="100" value="60" /><b
                id="opv"
                >60%</b
              >
            </div>
            <input type="file" id="sfile" accept=".stylx" hidden />
            <div id="ss" class="mu" style="margin-bottom: 4px"></div>
            <div id="lgtools">
              <input
                id="lgq"
                type="search"
                placeholder="Cari kategori..."
                autocomplete="off"
              />
              <button class="mini" id="lgon" title="Tampilkan semua kategori">
                Semua
              </button>
              <button
                class="mini"
                id="lgoff"
                title="Sembunyikan semua kategori"
              >
                Kosong
              </button>
            </div>
            <div id="lgttl"></div>
            <div id="lg"></div>
          </div>
        </div>
        <div id="load">
          <div id="lt">Memuat...</div>
          <div class="bar"><i id="lb"></i></div>
        </div>
      </div>
      <section id="panel">
        <nav id="nav"></nav>
        <div id="content">
          <p class="mu">
            Hasil analisis akan tampil di sini setelah data diunggah.
          </p>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- baru -->
    <script src="supabase.js"></script>
    <!-- baru -->
    <script src="app.js"></script>
    <script src="storage.js"></script>
    <!-- baru, harus setelah app.js -->
  </body>
</html>
